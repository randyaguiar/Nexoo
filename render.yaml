# Despliegue del backend en Render. La base de datos vive en Supabase, así que
# aquí solo se define el servicio web; las variables marcadas sync:false se
# rellenan una sola vez en el panel de Render.
services:
  - type: web
    name: nexoo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Admin__JwtSigningKey
        generateValue: true
      - key: Smtp__Host
        sync: false
      - key: Smtp__User
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromAddress
        sync: false
